AWSTemplateFormatVersion: '2010-09-09'
Description: RCReport - Lambda + EventBridge

Parameters:

  DeploymentS3Bucket:
    Type: String

  LambdaS3Key:
    Type: String

  LayerS3Key:
    Type: String

Resources:

############################################################
# LAMBDA LAYER
############################################################

  RCReportLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: rcreport-python-libs
      CompatibleRuntimes:
        - python3.11
      Content:
        S3Bucket: !Ref DeploymentS3Bucket
        S3Key: !Ref LayerS3Key

############################################################
# LAMBDA FUNCTION
############################################################

  RCReportLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: rcreport-dev
      Runtime: python3.11
      Handler: lambda_handler.lambda_handler
      Role: arn:aws:iam::538620445745:role/rcreport-lambda-role
      Timeout: 900
      MemorySize: 512

      Code:
        S3Bucket: !Ref DeploymentS3Bucket
        S3Key: !Ref LambdaS3Key

      Layers:
        - !Ref RCReportLayer

      Environment:
        Variables:
          APP_ENV: dev

############################################################
# EVENTBRIDGE RULE
############################################################

  RCReportSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: rcreport-schedule
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt RCReportLambda.Arn
          Id: RCReportLambdaTarget

############################################################
# EVENTBRIDGE PERMISSION
############################################################

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RCReportLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RCReportSchedule.Arn